<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Safe Mint FingerCheck</title><style>body{font-family:system-ui,sans-serif;max-width:980px;margin:24px auto;padding:0 16px;background:#0b0d10;color:#eef}h1{font-size:24px}.card{background:#151922;border:1px solid #293142;border-radius:14px;padding:16px;margin:12px 0}.ok{border-color:#2f8f62}.row{display:flex;gap:12px;flex-wrap:wrap}.pill{padding:4px 8px;border-radius:999px;background:#242b38;font-size:12px}button{font:inherit;border:0;border-radius:10px;padding:11px 14px;cursor:pointer}.primary{background:#eef;color:#111;font-weight:700}code{word-break:break-all}.check{margin:6px 0}.small{opacity:.76;font-size:13px}.log{max-height:240px;overflow:auto;font-size:12px}</style></head><body><h1>☝️ Safe Mint FingerCheck</h1><p class="small">秘密鍵は扱いません。検出→eligibility→chain/target/value検査→eth_call simulation→tx生成まで自動。最後だけRabby等で本人が承認します。</p><div id="meta"></div><div id="ready"></div><div class="card"><b>監視ログ</b><div id="log" class="log"></div></div><script>
let status;
async function refresh(){try{status=await fetch('/api/status').then(r=>r.json());render()}catch(e){}}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function render(){document.getElementById('meta').innerHTML=`<div class="card row"><span class="pill">Robinhood Chain ID ${status.chainId}</span><span class="pill">poll ${status.pollMs}ms</span><span class="pill">max mint value ${status.maxMintValueWei} wei</span></div>`;const r=document.getElementById('ready');r.innerHTML=status.prepared.length?status.prepared.map((x,i)=>`<div class="card ok"><div class="row"><b>${esc(x.slug)}</b><span class="pill">${esc(x.stage)}</span><span class="pill">${esc(x.priceEth)}</span><span class="pill">${x.supply}/${x.max||'?'}</span></div><p class="small">Wallet <code>${esc(x.wallet)}</code></p><div class="check">☑ OpenSeaがこのwallet用Mint transactionを生成</div><div class="check">☑ Robinhood Chain (4663) と確認</div><div class="check">☑ Target: ${esc(x.targetKind)} / bytecodeあり</div><div class="check">☑ Mint valueが設定上限以下</div><div class="check">☑ eth_call simulation成功 / gas estimate ${esc(x.gasEstimate)}</div><p class="small">送信先 <code>${esc(x.target)}</code></p><label><input type="checkbox" id="ack${i}"> chain・送信先・Mint価格・walletを指差し確認した</label><br><br><button class="primary" onclick="mint(${i})">Rabbyで最終確認して送信</button></div>`).join(''):'<div class="card">現在、安全ゲートを全通過したMintはありません。</div>';document.getElementById('log').innerHTML=status.log.map(x=>`<div>${esc(x.time)} [${esc(x.type)}] ${esc(x.message)}</div>`).join('');}
async function mint(i){const x=status.prepared[i];if(!document.getElementById('ack'+i).checked)return alert('指差し確認チェックを入れてください。');if(!window.ethereum)return alert('Rabby/MetaMask等のブラウザウォレットが見つかりません。');const chain='0x'+Number(status.chainId).toString(16);let current=await ethereum.request({method:'eth_chainId'});if(current.toLowerCase()!==chain.toLowerCase()){try{await ethereum.request({method:'wallet_switchEthereumChain',params:[{chainId:chain}]});}catch(e){return alert('Robinhood Chainへ切替できませんでした: '+e.message)}}const accts=await ethereum.request({method:'eth_requestAccounts'});const from=accts[0];if(!from||from.toLowerCase()!==x.wallet.toLowerCase())return alert('接続walletが対象walletと違います。\n対象: '+x.wallet+'\n接続: '+from);const tx={from,to:x.target,data:x.data,value:'0x'+BigInt(x.priceWei).toString(16),chainId:chain};try{const hash=await ethereum.request({method:'eth_sendTransaction',params:[tx]});alert('送信しました。Tx: '+hash);}catch(e){alert('送信はキャンセル/失敗しました: '+e.message)}}
refresh();setInterval(refresh,1500);
</script></body></html>
