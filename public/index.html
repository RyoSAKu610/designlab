<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Safe Mint FingerCheck</title><style>body{font-family:system-ui,sans-serif;max-width:980px;margin:24px auto;padding:0 16px;background:#0b0d10;color:#eef}h1{font-size:24px}.card{background:#151922;border:1px solid #293142;border-radius:14px;padding:16px;margin:12px 0}.ok{border-color:#2f8f62}.warn{border-color:#b58b2d}.bad{border-color:#a94442}.row{display:flex;gap:12px;flex-wrap:wrap}.pill{padding:4px 8px;border-radius:999px;background:#242b38;font-size:12px}button{font:inherit;border:0;border-radius:10px;padding:11px 14px;cursor:pointer}button.primary{background:#eef;color:#111;font-weight:700}button:disabled{opacity:.45;cursor:not-allowed}code{word-break:break-all}.check{display:flex;gap:8px;align-items:center;margin:6px 0}.small{opacity:.76;font-size:13px}.mono{font-family:ui-monospace,monospace}.log{max-height:220px;overflow:auto;font-size:12px}</style></head><body><h1>☝️ Safe Mint FingerCheck</h1><p class="small">秘密鍵は扱いません。バックエンドがMint取引を準備し、最後の送信だけRabby等のブラウザウォレットで承認します。</p><div id="meta"></div><div id="ready"></div><div class="card"><b>監視ログ</b><div id="log" class="log"></div></div><script>
let status;
async function refresh(){status=await fetch('/api/status').then(r=>r.json());render();}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function render(){document.getElementById('meta').innerHTML=`<div class="card row"><span class="pill">Robinhood Chain ID ${status.chainId}</span><span class="pill">poll ${status.pollMs}ms</span><span class="pill">max value ${status.maxMintValueWei} wei</span></div>`;const r=document.getElementById('ready');r.innerHTML=status.prepared.length?status.prepared.map((x,i)=>`<div class="card ${x.contractMismatch?'warn':'ok'}"><div class="row"><b>${esc(x.slug)}</b><span class="pill">${esc(x.stage)}</span><span class="pill">${esc(x.priceEth)}</span><span class="pill">${x.supply}/${x.max||'?'}</span></div><p class="small">Wallet <code>${esc(x.wallet)}</code></p><div class="check">☑ OpenSea APIがこのwallet用のMint txを生成</div><div class="check">☑ targetにon-chain bytecodeあり</div><div class="check">☑ valueが安全上限以下</div><div class="check">${x.contractMismatch?'⚠ collection contractと送信targetが異なるため要手動確認':'☑ collection contractとtargetに不審な不一致なし'}</div><p class="small">Target <code>${esc(x.target)}</code></p><label><input type="checkbox" id="ack${i}"> 上の指差し確認を読み、送信先・金額・chainを確認した</label><br><br><button class="primary" onclick="mint(${i})" ${x.contractMismatch?'disabled':''}>Rabbyで最終確認して送信</button>${x.contractMismatch?'<p class="small">安全のため自動ボタン停止中。OpenSea/Explorerでtargetを確認後にwatch設定を見直してください。</p>':''}</div>`).join(''):'<div class="card">現在、安全条件を満たす準備済みMintはありません。</div>';document.getElementById('log').innerHTML=status.log.map(x=>`<div>${esc(x.time)} [${esc(x.type)}] ${esc(x.message)}</div>`).join('');}
async function mint(i){const x=status.prepared[i];if(!document.getElementById('ack'+i).checked)return alert('指差し確認チェックを入れてください。');if(!window.ethereum)return alert('Rabby/MetaMask等のブラウザウォレットが見つかりません。');const chain='0x'+Number(status.chainId).toString(16);const current=await ethereum.request({method:'eth_chainId'});if(current.toLowerCase()!==chain.toLowerCase()){try{await ethereum.request({method:'wallet_switchEthereumChain',params:[{chainId:chain}]});}catch(e){return alert('Robinhood Chainへ切替できませんでした: '+e.message)}}const accts=await ethereum.request({method:'eth_requestAccounts'});const from=accts[0];if(from.toLowerCase()!==x.wallet.toLowerCase())return alert('接続walletが対象walletと違います。\n対象: '+x.wallet+'\n接続: '+from);const tx={from,to:x.target,data:x.data,value:'0x'+BigInt(x.priceWei).toString(16),chainId:chain};try{const hash=await ethereum.request({method:'eth_sendTransaction',params:[tx]});alert('送信しました。Tx: '+hash);}catch(e){alert('送信はキャンセル/失敗しました: '+e.message)}}
refresh();setInterval(refresh,1500);
</script></body></html>
